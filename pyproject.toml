[project]
name = "edital-depad-comunidades"
version = "0.1.0"
description = "Sistema de Gestão e Análise de Edital - DEPED / MDS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<5.2",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B904",  # allow raise without from inside custom exceptions where clean
    "B008",  # do not perform function calls in argument defaults
    "E501",  # line length handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers -ra"
markers = [
    "legacy: tests requiring or asserting against the legacy excel golden master",
    "slow: tests with extensive dataset setup",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/wsgi.py",
    "*/asgi.py",
    "config/settings.py",
]
