{% extends "base.html" %}
{% block content %}

<p>A análise documental ainda não foi iniciada.</p>
{% if can_start %}
<form method="post" action="{% url 'evaluation-start' submission_id=submission.id %}">

</form>
{% endif %}
{% endblock %}
