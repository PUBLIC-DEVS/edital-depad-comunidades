name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edital_depad_test
          POSTGRES_USER: edital_user
          POSTGRES_PASSWORD: edital_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Check Code Formatting with Ruff
        run: |
          ruff format --check .

      - name: Django System Check
        run: |
          python manage.py check

      - name: Check for Unmigrated Database Changes
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Test Suite with Pytest and Coverage
        env:
          DATABASE_URL: postgres://edital_user:edital_password@localhost:5432/edital_depad_test
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "False"
        run: |
          pytest -m "not legacy_real" --cov=apps --cov-report=term-missing
